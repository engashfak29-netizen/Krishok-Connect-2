services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_DB: krishok_connect
      POSTGRES_USER: krishok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishok -d krishok_connect"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - media_data:/app/app/media

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "worker.py", "--loop", "60"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: "0.75"

volumes:
  postgres_data:
  redis_data:
  media_data:
