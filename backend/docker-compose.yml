version: '3.8'

services:
  api:
    build: .
    container_name: krishok-connect-api
    ports:
      - "8000:8000"
    env_file: 
      - .env.dev
    volumes:
      - ./app:/app/app
      - ./media:/app/media
      - ./ai_knowledge_uploads:/app/ai_knowledge_uploads
    environment:
      - DATABASE_URL=sqlite:///./krishok_connect.db
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  media:
  ai_uploads:
