<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>চ্যাট — Krishok Connect</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile-app.css">
</head>
<body style="padding-bottom:0;">
<div class="app" style="padding-bottom:0;">

  <header class="page-header">
    <a class="icon-btn" href="chat.html"><span data-icon="back"></span></a>
    <img class="avatar avatar-36" id="peerAvatar" src="" alt="">
    <div style="flex:1; min-width:0;">
      <a id="peerNameLink" href="#" style="font-size:13.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:4px;"></a>
      <div style="font-size:10.5px; color:var(--primary); font-weight:600;" id="peerStatus">অনলাইন</div>
    </div>
    <button class="icon-btn on-light" id="peerAudioBtn" title="অডিও কল"><span data-icon="phone"></span></button><button class="icon-btn on-light" id="peerCallBtn" title="ভিডিও কল"><span data-icon="video"></span></button>
  </header>

  <div id="callPanel" style="display:none;padding:10px;background:#f5f7f8;border-bottom:1px solid #ddd">
<div style="display:flex;gap:8px;flex-wrap:wrap"><video id="remoteVideo" autoplay playsinline style="width:100%;max-height:300px;border-radius:12px;background:#111;display:block"></video><video id="localVideo" autoplay muted playsinline style="width:120px;height:90px;object-fit:cover;border-radius:10px;background:#111;display:none"></video></div>
<div id="callStatus" style="margin:8px 0;font-weight:700">কল</div><button class="btn btn-primary" id="acceptCall">গ্রহণ</button> <button class="btn danger" id="rejectCall">বাতিল</button> <button class="btn danger" id="endCall">কল শেষ</button>
</div><div class="chat-room-body" id="msgBody"></div>

  <div class="chat-input-bar">
    <button class="icon-btn" id="attachBtn" title="ছবি পাঠান">📎</button><input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
    <input type="text" id="msgInput" placeholder="মেসেজ লিখুন...">
    <button class="send-btn" id="sendBtn"><span data-icon="send" data-size="17"></span></button>
  </div>
</div>

<script src="icons.js"></script>
<script src="api.js"></script>
<script src="app-data.js"></script>
<script src="app-common.js"></script>
<script src="chat-room.js"></script>
</body>
</html>
