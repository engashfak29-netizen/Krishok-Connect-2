<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>সেটিংস — Krishok Connect</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile-app.css">
</head>
<body class="user-app">
<div class="app">
  <header class="page-header">
    <a class="icon-btn" href="profile.html"><span data-icon="back"></span></a>
    <div class="page-title">সেটিংস</div>
  </header>

  <div style="padding:16px; display:flex; flex-direction:column; gap:10px;">
    <a class="card" href="edit-profile.html" style="display:flex; align-items:center; gap:12px; padding:13px 14px;">
      <span style="color:var(--primary);" data-icon="edit" data-size="18"></span><span style="font-size:13.5px; font-weight:600;">প্রোফাইল এডিট করুন</span>
    </a>
    <a class="card" href="notifications.html" style="display:flex; align-items:center; gap:12px; padding:13px 14px;">
      <span style="color:var(--primary);" data-icon="bell" data-size="18"></span><span style="font-size:13.5px; font-weight:600;">নোটিফিকেশন</span>
    </a>
    <button class="card" onclick="toast('ভাষা: বাংলা (স্বয়ংক্রিয়)')" style="display:flex; align-items:center; gap:12px; padding:13px 14px; width:100%; text-align:left;">
      <span style="color:var(--primary);" data-icon="leaf" data-size="18"></span><span style="font-size:13.5px; font-weight:600;">ভাষা — বাংলা</span>
    </button>
    <button class="card" onclick="toast('গোপনীয়তা ও নিরাপত্তা API পরবর্তী ধাপে সংযুক্ত হবে')" style="display:flex; align-items:center; gap:12px; padding:13px 14px; width:100%; text-align:left;">
      <span style="color:var(--primary);" data-icon="check" data-size="18"></span><span style="font-size:13.5px; font-weight:600;">গোপনীয়তা ও নিরাপত্তা</span>
    </button>
    <button class="card" id="logoutBtn" style="display:flex; align-items:center; gap:12px; padding:13px 14px; width:100%; text-align:left;">
      <span style="color:var(--red);" data-icon="logout" data-size="18"></span><span style="font-size:13.5px; font-weight:600; color:var(--red);">লগআউট করুন</span>
    </button>
  </div>
</div>

<script src="icons.js"></script>
<script src="api.js"></script>
<script src="app-data.js"></script>
<script src="app-common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async()=>{
  await kcReady; if(!KC.currentUserId)return;
  mountIcons();
  document.getElementById("logoutBtn").addEventListener("click", async()=>{ try{await KC_API.post("/api/v1/auth/logout",{});}catch(e){} KC_API.setToken(""); location.href="auth.html"; });
});
</script>
</body>
</html>
