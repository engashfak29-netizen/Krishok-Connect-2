<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>বাজারদর — Krishok Connect</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile-app.css">
</head>
<body class="user-app">
<div class="app">
  <header class="page-header">
    <a class="icon-btn" href="index.html"><span data-icon="back"></span></a>
    <div class="page-title">আজকের বাজারদর</div>
  </header>

  <div style="padding:12px 16px 0;display:flex;gap:8px;flex-wrap:wrap"><input id="cropFilter" placeholder="ফসলের নাম" style="flex:1;min-width:140px;padding:10px;border:1px solid var(--border);border-radius:10px"><input id="marketFilter" placeholder="বাজার" style="flex:1;min-width:120px;padding:10px;border:1px solid var(--border);border-radius:10px"><button id="refreshPrices" class="btn btn-primary">আপডেট</button></div>
  <div id="trendBox" style="padding:0 16px"></div>
  <div id="list" style="padding:12px 16px; display:flex; flex-direction:column; gap:9px;"></div>

  <div class="bottom-nav" id="bottomNav"></div>
</div>

<script src="icons.js"></script>
<script src="api.js"></script>
<script src="app-data.js"></script>
<script src="app-common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async()=>{
  await kcReady; if(!KC.currentUserId)return;
  mountIcons();
  renderBottomNav("home");
  async function load(){const crop=document.getElementById('cropFilter').value.trim(),market=document.getElementById('marketFilter').value.trim();try{const rows=await KC_API.get('/api/v1/market-prices?limit=100'+(crop?'&crop='+encodeURIComponent(crop):'')+(market?'&market='+encodeURIComponent(market):''));document.getElementById('list').innerHTML=rows.map(p=>`<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px"><div style="font-size:26px">🌾</div><div style="flex:1"><div style="font-size:13.5px;font-weight:700">${escapeHtml(p.crop)}</div><div style="font-size:12px;color:var(--ink-muted);margin-top:2px">${escapeHtml(p.market||'বাংলাদেশ')} · ${escapeHtml(p.date||'')}</div></div><b>৳ ${Number(p.price).toLocaleString('bn-BD')} / ${escapeHtml(p.unit||'kg')}</b></div>`).join('')||'<div class="empty-state">বাজার দর পাওয়া যায়নি</div>';}catch(e){document.getElementById('list').innerHTML='<div class="empty-state">'+escapeHtml(e.message)+'</div>'}}
  document.getElementById('refreshPrices').onclick=load; load();
});
</script>
</body>
</html>
