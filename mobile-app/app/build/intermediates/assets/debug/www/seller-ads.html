<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Ads</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile-app.css"></head><body class="user-app"><div class="app"><header class="app-header"><div class="header-row"><b>📣 Sales Ads</b></div></header><main style="padding:14px 16px 100px"><section class="card" style="padding:16px"><input id="headline" class="input" placeholder="বিজ্ঞাপনের শিরোনাম"><textarea id="description" class="input" placeholder="বিজ্ঞাপনের বিবরণ"></textarea><input id="product" class="input" placeholder="Product ID (ঐচ্ছিক)"><input id="landing" class="input" placeholder="Landing URL (ঐচ্ছিক)"><button id="create" class="btn btn-primary">Ad তৈরি করুন</button></section><section id="ads"></section></main></div><script src="api.js"></script><script src="app-common.js"></script><script>async function load(){try{const a=await KC_API.get('/api/v1/seller/ads');document.getElementById('ads').innerHTML=a.map(x=>`<div class="card" style="padding:14px;margin-top:10px"><b>${escapeHtml(x.headline)}</b><div>${escapeHtml(x.description||'')}</div><span class="badge">${x.status}</span></div>`).join('')}catch(e){toast(e.message)}}document.addEventListener('DOMContentLoaded',async()=>{await kcReady;load();document.getElementById('create').onclick=async()=>{try{await KC_API.post('/api/v1/seller/ads',{headline:document.getElementById('headline').value,description:document.getElementById('description').value,product_id:document.getElementById('product').value||null,landing_url:document.getElementById('landing').value||null});toast('Ad তৈরি হয়েছে');load()}catch(e){toast(e.message)}}})</script></body></html>
